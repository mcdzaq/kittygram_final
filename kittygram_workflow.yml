name: Kittygram CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kittygram-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend and infrastructure tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: kittygram
          POSTGRES_USER: kittygram
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kittygram -d kittygram"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DJANGO_TESTING: "1"
      POSTGRES_DB: kittygram
      POSTGRES_USER: kittygram
      POSTGRES_PASSWORD: ci-only-password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: ruff check backend scripts
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python backend/manage.py test cats --verbosity 2
      - run: pytest tests/test_files.py
      - name: Check assignment workflow copy
        run: cmp .github/workflows/main.yml kittygram_workflow.yml

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test -- --watchAll=false --runInBand
        env:
          CI: "true"
      - run: npm run build
        env:
          CI: "true"

  integration:
    name: Containers, HTTP and persistent data
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: kittygram-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/init_env.py
      - run: docker compose config --quiet
      - run: docker compose -f docker-compose.production.yml config --quiet
      - run: docker compose up --build --wait --wait-timeout 180
      - run: python3 scripts/smoke.py seed
      - name: Recreate containers while retaining volumes
        run: |
          docker compose down
          docker compose up --wait --wait-timeout 180
      - run: python3 scripts/smoke.py verify
      - name: Diagnostics on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail 100
      - name: Remove this run's ephemeral containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans

  publish:
    name: Publish ${{ matrix.component }} image
    needs: [backend, frontend, integration]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: backend
          - component: frontend
            context: frontend
          - component: gateway
            context: nginx
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: mcdzaq
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            mcdzaq/kittygram_${{ matrix.component }}:latest
            mcdzaq/kittygram_${{ matrix.component }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  notify:
    name: Verify public images and notify Telegram
    needs: [publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check all images are public
        run: |
          for component in backend frontend gateway; do
            curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 \
              "https://hub.docker.com/v2/namespaces/mcdzaq/repositories/kittygram_${component}/" \
              --output /dev/null
          done
      - name: Send successful CI result
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
        run: python3 scripts/notify.py
